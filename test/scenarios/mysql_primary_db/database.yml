#
#  this test config has a primary database named "primary" on a MySQL server
#
#  The server runs on the port in ARTENANT_MYSQL_PORT, which defaults to 13306. Run bin/setup to
#  start it. The database names are short, because MySQL limits a name to 64 characters, and they
#  all begin with the prefix of the test process, because the server is shared.
#
test:
  primary:
    tenanted: true
    adapter: "mysql2"
    host: "127.0.0.1"
    port: "%{mysql_port}"
    username: "root"
    database: "%{prefix}_t_%%{tenant}"
    migrations_paths: "%{db_path}/tenanted_migrations"
  shared:
    adapter: "mysql2"
    host: "127.0.0.1"
    port: "%{mysql_port}"
    username: "root"
    database: "%{prefix}_shared"
    migrations_paths: "%{db_path}/shared_migrations"
