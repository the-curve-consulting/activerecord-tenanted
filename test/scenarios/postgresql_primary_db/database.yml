#
#  this test config has a primary database named "primary" on a PostgreSQL server
#
#  The tenanted database names carry a "_t_" part, so that the LIKE pattern that finds
#  the tenant databases cannot match the untenanted "shared" database beside them.
#
test:
  primary:
    tenanted: true
    adapter: "postgresql"
    host: "localhost"
    port: "%{postgres_port}"
    username: "postgres"
    password: "postgres"
    database: "%{prefix}_%{env}_t_%%{tenant}"
    migrations_paths: "%{db_path}/tenanted_migrations"
  shared:
    adapter: "postgresql"
    host: "localhost"
    port: "%{postgres_port}"
    username: "postgres"
    password: "postgres"
    database: "%{prefix}_%{env}_shared"
    migrations_paths: "%{db_path}/shared_migrations"
