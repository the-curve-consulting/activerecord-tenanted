name: ci

permissions: {}

concurrency:
  group: "${{github.workflow}}-${{github.ref}}"
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]
    branches:
      - '*'

jobs:
  lint-actions:
    name: GitHub Actions audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@20eb24b0d509e2b9ed9b6d42ddfeb992915e0564 # v1.341.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bin/rubocop -f github

  rails_versions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      gemfiles: ${{ steps.gemfiles.outputs.gemfiles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: gemfiles
        run: echo "gemfiles=$(ruby -rjson -e 'puts Dir["gemfiles/*.gemfile"].map { |f| File.basename(f, ".gemfile") }.sort.to_json')" >> "$GITHUB_OUTPUT"

  unit:
    name: "unit (${{ matrix.gemfile }}, ${{ matrix.adapter }})"
    needs: rails_versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        gemfile: ${{ fromJSON(needs.rails_versions.outputs.gemfiles) }}
        adapter: [sqlite3]
    continue-on-error: ${{ matrix.gemfile == 'rails_edge' }}
    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.gemfile }}.gemfile
      ARTENANT_ADAPTERS: ${{ matrix.adapter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@20eb24b0d509e2b9ed9b6d42ddfeb992915e0564 # v1.341.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bin/test-unit

  unit-server:
    name: "unit (${{ matrix.gemfile }}, ${{ matrix.adapter }})"
    needs: rails_versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        gemfile: ${{ fromJSON(needs.rails_versions.outputs.gemfiles) }}
        adapter: [mysql2, trilogy, postgresql]
    continue-on-error: ${{ matrix.gemfile == 'rails_edge' }}
    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.gemfile }}.gemfile
      ARTENANT_ADAPTERS: ${{ matrix.adapter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@20eb24b0d509e2b9ed9b6d42ddfeb992915e0564 # v1.341.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      #  A service container cannot be given arguments for the server itself, only docker options,
      #  and the settings that make a run fast are server arguments. The same script that a
      #  developer runs starts the servers here, so both use servers with the same settings.
      - run: bin/db-servers

      - run: bin/test-unit

  integration:
    name: "integration (${{ matrix.gemfile }}, ${{ matrix.adapter }})"
    needs: rails_versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        gemfile: ${{ fromJSON(needs.rails_versions.outputs.gemfiles) }}
        adapter: [sqlite3]
    continue-on-error: ${{ matrix.gemfile == 'rails_edge' }}
    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.gemfile }}.gemfile
      ARTENANT_ADAPTERS: ${{ matrix.adapter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@20eb24b0d509e2b9ed9b6d42ddfeb992915e0564 # v1.341.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bin/test-integration

  integration-server:
    name: "integration (${{ matrix.gemfile }}, ${{ matrix.adapter }})"
    needs: rails_versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        gemfile: ${{ fromJSON(needs.rails_versions.outputs.gemfiles) }}
        adapter: [mysql2, trilogy, postgresql]
    continue-on-error: ${{ matrix.gemfile == 'rails_edge' }}
    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.gemfile }}.gemfile
      ARTENANT_ADAPTERS: ${{ matrix.adapter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@20eb24b0d509e2b9ed9b6d42ddfeb992915e0564 # v1.341.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      #  A service container cannot be given arguments for the server itself, only docker options,
      #  and the settings that make a run fast are server arguments. The same script that a
      #  developer runs starts the servers here, so both use servers with the same settings.
      - run: bin/db-servers

      - run: bin/test-integration
